name: Update Repository README

on:
  release:
    types:
      - published

  workflow_call:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update published package catalog
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Regenerate and publish repository README
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ($attempt = 1; $attempt -le 5; $attempt++) {
              git fetch origin main

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not fetch current main."
              }

              git reset --hard origin/main

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not reset to current main."
              }

              & ".\.github\scripts\New-RepositoryReadme.ps1" `
                  -Repository "${{ github.repository }}"

              git add -- README.md
              git diff --cached --quiet
              $diffExitCode = $LASTEXITCODE

              if ($diffExitCode -eq 0) {
                  Write-Host "README.md is already current."
                  exit 0
              }

              if ($diffExitCode -ne 1) {
                  throw ("Could not inspect the staged README.md diff. Git exited with code $diffExitCode.")
              }

              git commit -m "docs: update published package catalog"

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not commit generated README.md."
              }

              git push origin HEAD:main

              if ($LASTEXITCODE -eq 0) {
                  exit 0
              }

              if ($attempt -eq 5) {
                  throw "Could not publish generated README.md after 5 attempts."
              }

              Write-Host "main advanced while publishing README.md; regenerating from the latest main."
              Start-Sleep -Seconds (2 * $attempt)
          }
