name: Library Releases

on:
  push:
    tags:
      - "apiprotocol/v*-r*"
      - "logging/v*-r*"
      - "networking/v*-r*"
      - "semanticversioning/v*-r*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test and create source bundle
        id: bundle
        shell: pwsh
        run: |
          & ".\.github\scripts\New-LibraryReleaseBundle.ps1" `
              -Tag "${{ github.ref_name }}" `
              -OutputDirectory "$env:RUNNER_TEMP\library-release"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArguments = @(
              "release",
              "create",
              "${{ github.ref_name }}",
              "${{ steps.bundle.outputs.asset_path }}",
              "${{ steps.bundle.outputs.checksum_path }}",
              "--verify-tag",
              "--latest=false",
              "--title",
              "${{ steps.bundle.outputs.release_title }}",
              "--notes-file",
              "${{ steps.bundle.outputs.release_notes_path }}"
          )

          if ("${{ steps.bundle.outputs.is_prerelease }}" -eq "true") {
              $releaseArguments += "--prerelease"
          }

          & gh @releaseArguments

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed."
          }
