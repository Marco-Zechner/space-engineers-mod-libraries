name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-format:
    name: SELibs package format
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test SELibs release assets
        shell: powershell
        run: |
          & ".\.github\tests\New-LibraryReleaseBundle.Tests.ps1"
      - name: Test automatic package discovery
        shell: powershell
        run: |
          & ".\.github\tests\LibraryReleaseMetadata.Tests.ps1"

  discover:
    name: Discover test projects
    runs-on: windows-latest

    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Discover portable tests
        id: projects
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repoRoot = [System.IO.Path]::GetFullPath(".")

          . ".\.github\scripts\LibraryReleaseMetadata.ps1"

          $libraries = @(
              Get-ReleaseLibraries -RepoRoot $repoRoot
          )

          $projectMap = @{}

          foreach ($library in $libraries) {
              foreach (
                  $project in @(
                      Get-LibraryPortableTestProjects `
                          -Library $library `
                          -RepoRoot $repoRoot
                  )
              ) {
                  $projectMap[
                      $project.FullName.ToLowerInvariant()
                  ] = $project
              }
          }

          $projects = @(
              $projectMap.Values |
                  Sort-Object FullName
          )

          if ($projects.Count -eq 0) {
              throw "No package-root test projects were found."
          }

          $include = foreach ($project in $projects) {
              $relativePath = [System.IO.Path]::GetRelativePath(
                  $env:GITHUB_WORKSPACE,
                  $project.FullName
              ).Replace("\", "/")

              $displayName = $project.BaseName

              $id = (
                  $displayName.ToLowerInvariant() `
                      -replace "[^a-z0-9]+", "-"
              ).Trim("-")

              @{
                  name = $displayName
                  id = $id
                  project = $relativePath
              }
          }

          $matrix = @{
              include = @($include)
          } | ConvertTo-Json -Compress -Depth 4

          "matrix=$matrix" >> $env:GITHUB_OUTPUT

          Write-Host "Package-root test projects:"

          $projects | ForEach-Object {
              Write-Host "  $($_.FullName)"
          }
  test:
    name: ${{ matrix.name }}
    needs: discover
    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test "${{ matrix.project }}" `
              --configuration Release `
              --nologo `
              --verbosity normal `
              --logger "trx;LogFileName=${{ matrix.id }}.trx" `
              --results-directory "TestResults/${{ matrix.id }}"
